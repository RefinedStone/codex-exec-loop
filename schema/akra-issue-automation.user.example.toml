# 사용자 파일: $AKRA_HOME/issue-automation.toml
# 기본 요청은 observe, 자율 상한은 propose, 외부 이슈 쓰기 허가는 모두 false이다.
# 현재는 정책 해석만 제공하며 수집·판정·실행에는 아직 연결하지 않는다.
schema_version = 1

[binding.github]
# repository는 생략하면 후속 연결에서 origin을 사용한다.
mode = "observe"

[authority]
autonomy_cap = "propose"

[select]
mode = "labels_any"
labels_any = ["akra:auto", "akra:gated", "akra:manual"]
# 실제로 검증한 공급자의 안정 ID로 바꿔야 한다. 아래 두 Node ID는 설명용 가짜 값이다.
# GitHub는 GraphQL Node ID를 사용한다. 로그인 이름을 자동 조회하거나 대신 저장하지 않는다.
trusted_actors = [
  { provider = "github", server_id = "github.com", actor_id = "U_example_maintainer" },
  { provider = "github", server_id = "github.com", actor_id = "U_example_reviewer" },
]

# 분류 규칙은 위에서부터 적용하며 labels_any와 paths_any는 OR 조건이다.
# 일치하지 않으면 normal이다. 배열 전체가 한 leaf이므로 저장소 규칙 배열이 이를 대체한다.
[[classify.rule]]
class = "high"
labels_any = ["security", "migration"]
paths_any = ["src/auth/**"]

[[classify.rule]]
class = "low"
labels_any = ["docs", "chore"]

[gates.propose.low]
start = "human"
spec = "human"
plan = "human"
delivery = "human"
merge = "human"

[gates.gated.normal]
start = "timeout_arbiter"
spec = "human"
plan = "timeout_arbiter"
delivery = "human"
merge = "human"

[timeouts]
start = "24h"
remind_before = "2h"

[budget]
max_running = 2
max_started_per_day = 5
max_attempts = 3

[feedback]
comment = false
labels = false
transition = false
telegram = false

[close]
when = "never"

[protection]
# 내장 보호 경로에 추가한다. []으로 내장 보호를 제거할 수 없다.
paths = ["src/auth/**"]

[human_required]
# 열거한 규칙은 내장 규칙과 합쳐진다. []을 써도 내장 10개 규칙은 남는다.
rules = ["high_risk", "protected_path"]

[[human_required.additional]]
labels_any = ["needs-human"]
gates = ["start", "delivery", "merge"]
