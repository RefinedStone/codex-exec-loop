# 저장소 파일: workspace/.akra/issue-automation.toml
# 사용자 예시와 함께 사용할 수 있는 부분 설정이다.
# 일반 leaf는 저장소 > 사용자 > 내장, 권한/예산/신뢰는 사용자 상한 안에서만 제한한다.
schema_version = 1

[binding.github]
repository = "example/automation-demo"
mode = "observe"

[authority]
autonomy_cap = "propose"

# 실행 계약의 라벨 이름은 각 leaf를 바꿀 수 있으며 네 이름은 서로 달라야 한다.
[labels]
auto = "akra:auto"
gated = "akra:gated"
manual = "akra:manual"
hold = "akra:hold"

[select]
mode = "labels_any"
# 모든 layer에서 labels_any를 생략하면 최종 auto/gated/manual 이름을 선택한다.
# 아래처럼 명시한 값(빈 [] 포함)은 라벨 이름 변경 뒤에도 보존한다.
# []은 선택 대상 없음이다. 전체 열린 이슈를 선택하려면 mode = "all_open"을 명시한다.
labels_any = ["akra:auto", "akra:manual"]
# 생략하면 사용자 목록을 상속하며, []이면 모두 제외한다.
# 이 가짜 Node ID는 사용자 예시에도 있어 교집합에 남는다. 실제 검증한 ID로 바꿔야 한다.
trusted_actors = [
  { provider = "github", server_id = "github.com", actor_id = "U_example_maintainer" },
]

# 사용자 classify.rule 전체를 대체하므로 필요한 규칙을 모두 적는다.
[[classify.rule]]
class = "high"
labels_any = ["security", "migration"]
paths_any = ["src/auth/**", "src/payments/**"]

[[classify.rule]]
class = "low"
labels_any = ["docs", "chore"]

[gates.gated.low]
start = "auto"
delivery = "human"
merge = "human"

[timeouts]
# remind_before는 사용자 예시의 2h를 상속한다. 유효 정책에서 start보다 작아야 한다.
start = "12h"

[budget]
# 사용자 예시의 2/5/3보다 낮은 제한이다. 더 큰 수를 적어도 사용자 최대값을 넘지 못한다.
max_running = 1
max_started_per_day = 3
max_attempts = 2

[feedback]
# 저장소의 true만으로 사용자 허가를 켤 수 없다.
comment = false
labels = false
transition = false
telegram = false

[close]
when = "never"

[protection]
# 내장 및 사용자 보호 경로를 유지하면서 저장소 경로를 추가한다.
paths = ["src/payments/**"]

[human_required]
rules = []

[[human_required.additional]]
paths_any = ["src/payments/**"]
gates = ["plan", "merge"]
