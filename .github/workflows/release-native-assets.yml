name: Release Native Assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-native-assets-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch trusted release branch
        shell: bash
        run: >-
          git fetch --no-tags origin
          +refs/heads/prerelease:refs/remotes/origin/prerelease

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate_native_release_version.sh \
            --tag "${GITHUB_REF_NAME}" \
            --release-commit "${GITHUB_SHA}" \
            --allowed-ref refs/remotes/origin/prerelease

  build-native-assets:
    name: Build ${{ matrix.label }}
    needs:
      - validate-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Build distributable bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH="${source_date_epoch}"
          output="$(bash scripts/package_native_release.sh --target "${{ matrix.target }}")"
          printf '%s\n' "${output}"

          archive="$(printf '%s\n' "${output}" | sed -n 's/^archive=//p')"
          archive_checksum="$(printf '%s\n' "${output}" | sed -n 's/^archive_checksum=//p')"
          bundle_dir="$(printf '%s\n' "${output}" | sed -n 's/^bundle_dir=//p')"
          archive_upload="${archive}"
          archive_checksum_upload="${archive_checksum}"

          for required_path in "${archive}" "${archive_checksum}" "${bundle_dir}"; do
            if [[ -z "${required_path}" || ! -e "${required_path}" ]]; then
              echo "Expected release artifact was not created: ${required_path}" >&2
              exit 1
            fi
          done

          if [[ "${RUNNER_OS}" == "Windows" ]] && command -v cygpath >/dev/null 2>&1; then
            archive_upload="$(cygpath -m "${archive}")"
            archive_checksum_upload="$(cygpath -m "${archive_checksum}")"
          fi

          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"
          printf 'archive_checksum=%s\n' "${archive_checksum}" >> "${GITHUB_OUTPUT}"
          printf 'bundle_dir=%s\n' "${bundle_dir}" >> "${GITHUB_OUTPUT}"
          printf 'archive_upload=%s\n' "${archive_upload}" >> "${GITHUB_OUTPUT}"
          printf 'archive_checksum_upload=%s\n' "${archive_checksum_upload}" >> "${GITHUB_OUTPUT}"

      - name: Verify packaged bundle
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/verify_native_release.sh \
            --archive "${{ steps.package.outputs.archive }}" \
            --bundle-dir "${{ steps.package.outputs.bundle_dir }}" \
            --version "${GITHUB_REF_NAME}" \
            --target "${{ matrix.target }}" \
            --profile release

      - name: Upload release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.archive_upload }}
            ${{ steps.package.outputs.archive_checksum_upload }}

  publish-release:
    name: Publish GitHub Release Assets
    needs:
      - build-native-assets
      - publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download packaged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: native-release-*
          merge-multiple: true

      - name: Reverify downloaded release assets
        shell: bash
        run: >-
          node npm/scripts/verify-native-release-assets.mjs
          --release-assets-dir release-assets
          --version "${GITHUB_REF_NAME}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-release-assets.sh \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GH_REPO}" \
            --expected-commit "${GITHUB_SHA}" \
            --title "codex-exec-loop-native ${GITHUB_REF_NAME}" \
            --notes "Automated native/npm release for ${GITHUB_REF_NAME}." \
            --asset-dir release-assets

  publish-npm:
    name: Publish npm Package
    needs:
      - build-native-assets
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Recheck npm release authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: bash scripts/validate_npm_release_auth.sh

      - name: Download packaged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: native-release-*
          merge-multiple: true

      - name: Reverify downloaded npm inputs
        shell: bash
        run: >-
          node npm/scripts/verify-native-release-assets.mjs
          --release-assets-dir release-assets
          --version "${GITHUB_REF_NAME}"

      - name: Stage npm packages
        shell: bash
        run: |
          set -euo pipefail

          node npm/scripts/stage-npm-packages.mjs \
            --release-assets-dir release-assets \
            --out-dir npm/dist/publish \
            --version "${GITHUB_REF_NAME}"

      - name: Publish platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          package_dirs=(
            npm/dist/publish/platforms/@refinedstone/akra-linux-x64
            npm/dist/publish/platforms/@refinedstone/akra-darwin-arm64
            npm/dist/publish/platforms/@refinedstone/akra-win32-x64
          )
          package_suffixes=(linux-x64 darwin-arm64 win32-x64)
          for index in "${!package_dirs[@]}"; do
            package_dir="${package_dirs[${index}]}"
            expected_version="${release_version}-${package_suffixes[${index}]}"
            env -u NODE_AUTH_TOKEN bash .github/scripts/verify-tag-target.sh \
              --repo "${GITHUB_REPOSITORY}" \
              --tag "${GITHUB_REF_NAME}" \
              --expected-commit "${GITHUB_SHA}"
            env -u GH_TOKEN node npm/scripts/publish-package.mjs \
              --package-dir "${package_dir}" \
              --expected-version "${expected_version}" \
              --tag platform
            env -u NODE_AUTH_TOKEN bash .github/scripts/verify-tag-target.sh \
              --repo "${GITHUB_REPOSITORY}" \
              --tag "${GITHUB_REF_NAME}" \
              --expected-commit "${GITHUB_SHA}"
          done

      - name: Publish main package
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          env -u NODE_AUTH_TOKEN bash .github/scripts/verify-tag-target.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --expected-commit "${GITHUB_SHA}"
          env -u GH_TOKEN node npm/scripts/publish-package.mjs \
            --package-dir npm/dist/publish/main \
            --expected-version "${release_version}" \
            --tag latest
          env -u NODE_AUTH_TOKEN bash .github/scripts/verify-tag-target.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --expected-commit "${GITHUB_SHA}"
