name: Native PR Checks

on:
  pull_request:
    branches:
      - main
      - prerelease
  push:
    branches:
      - main
      - prerelease
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope to exercise
        required: true
        default: auto
        type: choice
        options:
          - auto
          - docs
          - rust
          - tui
          - admin
          - full
          - smoke
          - postmerge

permissions:
  contents: read

concurrency:
  group: native-pr-checks-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  AKRA_CI_MEASUREMENTS: artifacts/ci-performance
  AKRA_CI_PROFILE: dev/test

jobs:
  scope:
    name: CI Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      postmerge: ${{ steps.classify.outputs.postmerge }}
      rust: ${{ steps.classify.outputs.rust }}
      node: ${{ steps.classify.outputs.node }}
      portable: ${{ steps.classify.outputs.portable }}
      smoke: ${{ steps.classify.outputs.smoke }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      summary: ${{ steps.classify.outputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Test CI and agent planning policy
        run: node --test scripts/ci-scope.test.mjs scripts/agent-plan.test.mjs scripts/ci-performance.test.mjs

      - name: Classify validation scope
        id: classify
        env:
          AKRA_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          AKRA_CI_EVENT_NAME: ${{ github.event_name }}
          AKRA_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AKRA_CI_REF: ${{ github.ref }}
          AKRA_CI_REQUESTED_SCOPE: ${{ inputs.scope || 'auto' }}
        run: node scripts/ci-scope.mjs classify

  rust_tests:
    name: Rust Tests
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install measurement runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0

      - name: Restore Rust test cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-tests-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-v1
          restore-keys: |
            ${{ runner.os }}-rust-tests-
            ${{ runner.os }}-rust-

      - name: Run Rust tests
        run: node scripts/ci-performance.mjs run rust-tests -- cargo test --locked --timings

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  rust_lint:
    name: Rust Lint and Architecture
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install measurement runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          components: clippy,rustfmt

      - name: Restore Rust lint cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-lint-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-v1
          restore-keys: |
            ${{ runner.os }}-rust-lint-
            ${{ runner.os }}-rust-

      - name: Ensure shell tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Check TUI architecture
        run: node scripts/ci-performance.mjs run architecture -- bash scripts/check_tui_layering.sh

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: node scripts/ci-performance.mjs run clippy -- cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  node_surfaces:
    name: Node and Admin Surfaces
    needs: scope
    if: needs.scope.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            assets/admin/game/package-lock.json
            desktop/package-lock.json

      - name: Run Node and admin checks
        run: node scripts/ci-performance.mjs run node-admin -- bash scripts/check_node_surfaces.sh

      # Akra Desktop screen tests drive the built Electron app against the fake gateway (no codex, no turns).
      # The Node checks above install desktop dependencies without the Electron binary, so fetch it here.
      - name: Install Electron runtime for desktop screen tests
        run: |
          node desktop/node_modules/electron/install.js
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring dbus-x11

      - name: Run desktop screen tests
        env:
          CI: "true"
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          node scripts/ci-performance.mjs run desktop-e2e -- dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "akra-ci-fixture-keyring" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run --auto-servernum npm --prefix desktop run e2e
          '

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  portable_native:
    name: Portable Rust Check (${{ matrix.label }})
    needs: scope
    if: needs.scope.outputs.portable == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install measurement runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Restore portable Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ matrix.target }}-portable-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-v1
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-portable-

      - name: Run Windows portable validation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: node scripts/ci-performance.mjs run windows-portable -- bash scripts/check_windows_portable.sh

      - name: Check native target
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: node scripts/ci-performance.mjs run native-check -- cargo check --locked --all-features --lib --bins --timings --target "${{ matrix.target }}"

      - name: Test native process identity
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: >-
          node scripts/ci-performance.mjs run native-contract -- cargo test --locked --all-features --lib --timings --target "${{ matrix.target }}"
          process_liveness::tests:: -- --nocapture

      - name: Test native executable format validation
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: >-
          node scripts/ci-performance.mjs run native-contract -- cargo test --locked --all-features --lib --timings --target "${{ matrix.target }}"
          trusted_executable::tests::native_ -- --nocapture

      - name: Test native Vault key initialization and private storage
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          for filter in \
            'private_sqlite::tests::' \
            'stable_user_data_root::tests::' \
            'sqlite_issue_automation_store::private_store::tests::' \
            'adapter::outbound::vault_key_store::' \
            'application::service::evidence_vault_unlock::'
          do
            node scripts/ci-performance.mjs run native-contract -- cargo test --locked --all-features --lib --timings --target "${{ matrix.target }}" \
              "${filter}" -- --nocapture
          done

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  smoke_check:
    name: Rust Smoke Check
    needs: scope
    if: needs.scope.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install measurement runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0

      - name: Restore Rust smoke cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-smoke-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-v1
          restore-keys: |
            ${{ runner.os }}-rust-smoke-
            ${{ runner.os }}-rust-

      - name: Check native smoke target
        run: node scripts/ci-performance.mjs run smoke-check -- cargo check --locked --all-features --lib --bins --timings

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  fast_gate:
    name: Fast Gate
    needs:
      - scope
      - rust_lint
      - node_surfaces
      - smoke_check
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Evaluate fast admission jobs
        env:
          AKRA_CI_NODE_REQUIRED: ${{ needs.scope.outputs.node }}
          AKRA_CI_NODE_RESULT: ${{ needs.node_surfaces.result }}
          AKRA_CI_RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          AKRA_CI_RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          AKRA_CI_SCOPE_RESULT: ${{ needs.scope.result }}
          AKRA_CI_SMOKE_REQUIRED: ${{ needs.scope.outputs.smoke }}
          AKRA_CI_SMOKE_RESULT: ${{ needs.smoke_check.result }}
        run: node scripts/ci-scope.mjs fast-gate

  ci_gate:
    name: CI Gate
    needs:
      - scope
      - rust_tests
      - rust_lint
      - node_surfaces
      - portable_native
      - smoke_check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Evaluate required jobs
        env:
          AKRA_CI_NODE_REQUIRED: ${{ needs.scope.outputs.node }}
          AKRA_CI_NODE_RESULT: ${{ needs.node_surfaces.result }}
          AKRA_CI_PORTABLE_REQUIRED: ${{ needs.scope.outputs.portable }}
          AKRA_CI_PORTABLE_RESULT: ${{ needs.portable_native.result }}
          AKRA_CI_RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          AKRA_CI_RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          AKRA_CI_RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
          AKRA_CI_SCOPE_RESULT: ${{ needs.scope.result }}
          AKRA_CI_SMOKE_REQUIRED: ${{ needs.scope.outputs.smoke }}
          AKRA_CI_SMOKE_RESULT: ${{ needs.smoke_check.result }}
        run: node scripts/ci-scope.mjs gate

  post_merge_gate:
    name: Post-Merge Gate
    needs:
      - scope
      - rust_tests
      - rust_lint
      - node_surfaces
      - portable_native
      - smoke_check
    if: always() && needs.scope.outputs.postmerge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Evaluate post-merge jobs
        env:
          AKRA_CI_NODE_REQUIRED: ${{ needs.scope.outputs.node }}
          AKRA_CI_NODE_RESULT: ${{ needs.node_surfaces.result }}
          AKRA_CI_PORTABLE_REQUIRED: ${{ needs.scope.outputs.portable }}
          AKRA_CI_PORTABLE_RESULT: ${{ needs.portable_native.result }}
          AKRA_CI_RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          AKRA_CI_RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          AKRA_CI_RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
          AKRA_CI_SCOPE_RESULT: ${{ needs.scope.result }}
          AKRA_CI_SMOKE_REQUIRED: ${{ needs.scope.outputs.smoke }}
          AKRA_CI_SMOKE_RESULT: ${{ needs.smoke_check.result }}
        run: node scripts/ci-scope.mjs gate
