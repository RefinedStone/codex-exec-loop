name: Native PR Checks

on:
  pull_request:
    branches:
      - main
      - prerelease
  push:
    branches:
      - main
      - prerelease

permissions:
  contents: read

concurrency:
  group: native-pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  portable-native-check:
    name: Portable Rust Check (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Check native target
        shell: bash
        run: cargo check --locked --all-features --lib --bins --target "${{ matrix.target }}"

      - name: Test native process identity
        shell: bash
        run: >-
          cargo test --locked --all-features --lib --target "${{ matrix.target }}"
          process_liveness::tests:: -- --nocapture

      - name: Test native executable format validation
        shell: bash
        run: >-
          cargo test --locked --all-features --lib --target "${{ matrix.target }}"
          trusted_executable::tests::native_ -- --nocapture

      - name: Test Windows authority-store path security
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: >-
          cargo test --locked --all-features --lib --target "${{ matrix.target }}"
          sqlite_planning_authority_adapter::tests::authority_store_ -- --nocapture

      - name: Test Windows plain-workspace planning flow
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-features --lib --target "${{ matrix.target }}" \
            windows_plain_workspace_uses_private_authority_for_active_and_draft_flows -- --nocapture
          cargo test --locked --all-features --lib --target "${{ matrix.target }}" \
            windows_plain_workspace_production_flow_initializes_edits_and_resets_private_authority -- --nocapture

      - name: Test Windows Telegram private config security
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: >-
          cargo test --locked --all-features --lib --target "${{ matrix.target }}"
          telegram_bot::tests::telegram_config_windows_ -- --nocapture

      - name: Test Windows Telegram global stream gate
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: >-
          cargo test --locked --all-features --lib --target "${{ matrix.target }}"
          telegram_global_runner_lease::tests:: -- --nocapture

      - name: Test Windows trace private path security
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-features --lib --target "${{ matrix.target }}" \
            trace_event_log::tests::exact_trace_file_rejects_windows_ -- --nocapture
          cargo test --locked --all-features --lib --target "${{ matrix.target }}" \
            trace_event_log::tests::windows_trace_file_and_rolling_directory_receive_private_owner_acl -- --nocapture

      - name: Test Windows app-server environment key handling
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: >-
          cargo test --locked --all-features --lib --target "${{ matrix.target }}"
          actual_windows_environment_filter_accepts_mixed_case_allowlisted_keys -- --nocapture

      - name: Test Windows admin security
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-features --lib --target "${{ matrix.target }}" \
            admin_api::security::tests:: -- --nocapture
          for test_name in \
            admin_router_rejects_non_local_host_on_read_only_routes \
            admin_router_requires_capability_and_exact_loopback_authority \
            admin_login_exchanges_capability_for_strict_http_only_session_cookie \
            admin_json_mutations_require_header_csrf_and_share_reset_guard
          do
            cargo test --locked --all-features --lib --target "${{ matrix.target }}" \
              "$test_name" -- --nocapture
          done

      - name: Test Windows parallel worktree and host-owned worker commit
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-features --lib --target "${{ matrix.target }}" \
            application::service::parallel_mode::pool::paths::tests:: -- --nocapture
          cargo test --locked --all-features --lib --target "${{ matrix.target }}" \
            reconcile_provisions_missing_slots_into_idle_baselines -- --nocapture
          cargo test --locked --all-features --lib --target "${{ matrix.target }}" \
            host_owned_worker_commit_ -- --nocapture

  native-pr-checks:
    name: Native PR Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          components: clippy,rustfmt

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/admin/game/package-lock.json

      - name: Install shell tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run native PR checks
        shell: bash
        run: bash scripts/check_native_pr.sh
