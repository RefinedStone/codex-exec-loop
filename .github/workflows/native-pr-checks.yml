      - name: Test the built macOS confirmation process
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/ci-performance.mjs run native-confirmation -- node scripts/check_native_confirmation_process.mjs --all-features --target "${{ matrix.target }}" --timings

      - name: Save Rust registry cache
        id: save_registry
        if: success() && steps.rust_cache_policy.outputs.save-allowed == 'true' && steps.restore_registry.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.registry-paths }}
          key: ${{ steps.rust_cache_policy.outputs.registry-key }}

      - name: Save Rust target cache
        id: save_target
        if: success() && steps.rust_cache_policy.outputs.save-allowed == 'true' && steps.restore_target.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.target-directory }}
          key: ${{ steps.rust_cache_policy.outputs.target-key }}

      - name: Record complete Rust cache metrics
        if: always() && steps.rust_cache_policy.outcome == 'success'
        continue-on-error: true
        env:
          AKRA_CI_CACHE_REGISTRY_PRIMARY: ${{ steps.restore_registry.outputs.cache-primary-key }}
          AKRA_CI_CACHE_REGISTRY_MATCHED: ${{ steps.restore_registry.outputs.cache-matched-key }}
          AKRA_CI_CACHE_REGISTRY_HIT: ${{ steps.restore_registry.outputs.cache-hit }}
          AKRA_CI_CACHE_REGISTRY_OUTCOME: ${{ steps.restore_registry.outcome }}
          AKRA_CI_CACHE_REGISTRY_SAVE: ${{ steps.save_registry.outcome }}
          AKRA_CI_CACHE_TARGET_PRIMARY: ${{ steps.restore_target.outputs.cache-primary-key }}
          AKRA_CI_CACHE_TARGET_MATCHED: ${{ steps.restore_target.outputs.cache-matched-key }}
          AKRA_CI_CACHE_TARGET_HIT: ${{ steps.restore_target.outputs.cache-hit }}
          AKRA_CI_CACHE_TARGET_OUTCOME: ${{ steps.restore_target.outcome }}
          AKRA_CI_CACHE_TARGET_SAVE: ${{ steps.save_target.outcome }}
        run: node scripts/ci-cache.mjs record complete

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  smoke_check:
    name: Rust Smoke Check
    needs: scope
    if: needs.scope.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install measurement runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0

      - name: Prepare Rust cache policy
        id: rust_cache_policy
        env:
          AKRA_CI_CACHE_LANE: smoke
          AKRA_CI_TARGET: host
          AKRA_CI_FEATURES: all
          AKRA_CI_CACHE_MANIFEST_HASH: ${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config*') }}
          AKRA_CI_CACHE_LOCK_HASH: ${{ hashFiles('**/Cargo.lock') }}
        run: node scripts/ci-cache.mjs plan

      - name: Restore Rust registry cache
        id: restore_registry
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.registry-paths }}
          key: ${{ steps.rust_cache_policy.outputs.registry-key }}
          restore-keys: ${{ steps.rust_cache_policy.outputs.registry-prefix }}
          fail-on-cache-miss: false

      - name: Restore Rust target cache
        id: restore_target
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.target-directory }}
          key: ${{ steps.rust_cache_policy.outputs.target-key }}
          restore-keys: ${{ steps.rust_cache_policy.outputs.target-prefix }}
          fail-on-cache-miss: false

      - name: Clear restored Cargo timing diagnostics
        if: steps.rust_cache_policy.outcome == 'success'
        run: node scripts/ci-cache.mjs clear-timings

      - name: Record restored Rust cache metrics
        if: always() && steps.rust_cache_policy.outcome == 'success'
        continue-on-error: true
        env:
          AKRA_CI_CACHE_REGISTRY_PRIMARY: ${{ steps.restore_registry.outputs.cache-primary-key }}
          AKRA_CI_CACHE_REGISTRY_MATCHED: ${{ steps.restore_registry.outputs.cache-matched-key }}
          AKRA_CI_CACHE_REGISTRY_HIT: ${{ steps.restore_registry.outputs.cache-hit }}
          AKRA_CI_CACHE_REGISTRY_OUTCOME: ${{ steps.restore_registry.outcome }}
          AKRA_CI_CACHE_TARGET_PRIMARY: ${{ steps.restore_target.outputs.cache-primary-key }}
          AKRA_CI_CACHE_TARGET_MATCHED: ${{ steps.restore_target.outputs.cache-matched-key }}
          AKRA_CI_CACHE_TARGET_HIT: ${{ steps.restore_target.outputs.cache-hit }}
          AKRA_CI_CACHE_TARGET_OUTCOME: ${{ steps.restore_target.outcome }}
        run: node scripts/ci-cache.mjs record restored

      - name: Check native smoke target
        run: node scripts/ci-performance.mjs run smoke-check -- cargo check --locked --all-features --lib --bins --timings

      - name: Save Rust registry cache
        id: save_registry
        if: success() && steps.rust_cache_policy.outputs.save-allowed == 'true' && steps.restore_registry.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.registry-paths }}
          key: ${{ steps.rust_cache_policy.outputs.registry-key }}

      - name: Save Rust target cache
        id: save_target
        if: success() && steps.rust_cache_policy.outputs.save-allowed == 'true' && steps.restore_target.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.target-directory }}
          key: ${{ steps.rust_cache_policy.outputs.target-key }}

      - name: Record complete Rust cache metrics
        if: always() && steps.rust_cache_policy.outcome == 'success'
        continue-on-error: true
        env:
          AKRA_CI_CACHE_REGISTRY_PRIMARY: ${{ steps.restore_registry.outputs.cache-primary-key }}
          AKRA_CI_CACHE_REGISTRY_MATCHED: ${{ steps.restore_registry.outputs.cache-matched-key }}
          AKRA_CI_CACHE_REGISTRY_HIT: ${{ steps.restore_registry.outputs.cache-hit }}
          AKRA_CI_CACHE_REGISTRY_OUTCOME: ${{ steps.restore_registry.outcome }}
          AKRA_CI_CACHE_REGISTRY_SAVE: ${{ steps.save_registry.outcome }}
          AKRA_CI_CACHE_TARGET_PRIMARY: ${{ steps.restore_target.outputs.cache-primary-key }}
          AKRA_CI_CACHE_TARGET_MATCHED: ${{ steps.restore_target.outputs.cache-matched-key }}
          AKRA_CI_CACHE_TARGET_HIT: ${{ steps.restore_target.outputs.cache-hit }}
          AKRA_CI_CACHE_TARGET_OUTCOME: ${{ steps.restore_target.outcome }}
          AKRA_CI_CACHE_TARGET_SAVE: ${{ steps.save_target.outcome }}
        run: node scripts/ci-cache.mjs record complete

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  fast_gate:
    name: Fast Gate
    needs:
      - scope
      - rust_lint
      - node_surfaces
      - desktop_e2e
      - smoke_check
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Evaluate fast admission jobs
        env:
          AKRA_CI_NODE_REQUIRED: ${{ needs.scope.outputs.node }}
          AKRA_CI_NODE_RESULT: ${{ needs.node_surfaces.result }}
          AKRA_CI_DESKTOP_RESULT: ${{ needs.desktop_e2e.result }}
          AKRA_CI_RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          AKRA_CI_RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          AKRA_CI_SCOPE_RESULT: ${{ needs.scope.result }}
          AKRA_CI_SMOKE_REQUIRED: ${{ needs.scope.outputs.smoke }}
          AKRA_CI_SMOKE_RESULT: ${{ needs.smoke_check.result }}
        run: node scripts/ci-scope.mjs fast-gate

  ci_gate:
    name: CI Gate
    needs:
      - scope
      - rust_tests
      - rust_lint
      - node_surfaces
      - desktop_e2e
      - portable_native
      - smoke_check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Evaluate required jobs
        env:
          AKRA_CI_NODE_REQUIRED: ${{ needs.scope.outputs.node }}
          AKRA_CI_NODE_RESULT: ${{ needs.node_surfaces.result }}
          AKRA_CI_DESKTOP_RESULT: ${{ needs.desktop_e2e.result }}
          AKRA_CI_PORTABLE_REQUIRED: ${{ needs.scope.outputs.portable }}
          AKRA_CI_PORTABLE_RESULT: ${{ needs.portable_native.result }}
          AKRA_CI_RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          AKRA_CI_RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          AKRA_CI_RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
          AKRA_CI_SCOPE_RESULT: ${{ needs.scope.result }}
          AKRA_CI_SMOKE_REQUIRED: ${{ needs.scope.outputs.smoke }}
          AKRA_CI_SMOKE_RESULT: ${{ needs.smoke_check.result }}
        run: node scripts/ci-scope.mjs gate

  post_merge_gate:
    name: Post-Merge Gate
    needs:
      - scope
      - rust_tests
      - rust_lint
      - node_surfaces
      - desktop_e2e
      - portable_native
      - smoke_check
    if: always() && needs.scope.outputs.postmerge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Evaluate post-merge jobs
        env:
          AKRA_CI_NODE_REQUIRED: ${{ needs.scope.outputs.node }}
          AKRA_CI_NODE_RESULT: ${{ needs.node_surfaces.result }}
          AKRA_CI_DESKTOP_RESULT: ${{ needs.desktop_e2e.result }}
          AKRA_CI_PORTABLE_REQUIRED: ${{ needs.scope.outputs.portable }}
          AKRA_CI_PORTABLE_RESULT: ${{ needs.portable_native.result }}
          AKRA_CI_RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          AKRA_CI_RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          AKRA_CI_RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
          AKRA_CI_SCOPE_RESULT: ${{ needs.scope.result }}
          AKRA_CI_SMOKE_REQUIRED: ${{ needs.scope.outputs.smoke }}
          AKRA_CI_SMOKE_RESULT: ${{ needs.smoke_check.result }}
        run: node scripts/ci-scope.mjs gate
