name: Native PR Checks

on:
  pull_request:
    branches:
      - main
      - prerelease
      - 'codex/**'
  push:
    branches:
      - main
      - prerelease
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope to exercise
        required: true
        default: auto
        type: choice
        options:
          - auto
          - docs
          - rust
          - tui
          - admin
          - full
          - smoke
          - postmerge

permissions:
  contents: read

concurrency:
  group: native-pr-checks-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  AKRA_CI_MEASUREMENTS: artifacts/ci-performance
  AKRA_CI_PROFILE: dev/test

jobs:
  scope:
    name: CI Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      postmerge: ${{ steps.classify.outputs.postmerge }}
      rust: ${{ steps.classify.outputs.rust }}
      node: ${{ steps.classify.outputs.node }}
      portable: ${{ steps.classify.outputs.portable }}
      smoke: ${{ steps.classify.outputs.smoke }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      summary: ${{ steps.classify.outputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Test CI and agent planning policy
        run: node --test scripts/ci-scope.test.mjs scripts/agent-plan.test.mjs scripts/ci-performance.test.mjs scripts/native-rust-contracts.test.mjs scripts/ci-rust-test-inventory.test.mjs scripts/ci-cache.test.mjs scripts/native-confirmation-build-options.test.mjs

      - name: Classify validation scope
        id: classify
        env:
          AKRA_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          AKRA_CI_EVENT_NAME: ${{ github.event_name }}
          AKRA_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AKRA_CI_REF: ${{ github.ref }}
          AKRA_CI_REQUESTED_SCOPE: ${{ inputs.scope || 'auto' }}
        run: node scripts/ci-scope.mjs classify

  rust_tests:
    name: Rust Tests
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install measurement runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0

      - name: Prepare Rust cache policy
        id: rust_cache_policy
        env:
          AKRA_CI_CACHE_LANE: rust-tests
          AKRA_CI_TARGET: host
          AKRA_CI_FEATURES: default
          AKRA_CI_CACHE_MANIFEST_HASH: ${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config*') }}
          AKRA_CI_CACHE_LOCK_HASH: ${{ hashFiles('**/Cargo.lock') }}
        run: node scripts/ci-cache.mjs plan

      - name: Restore Rust registry cache
        id: restore_registry
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.registry-paths }}
          key: ${{ steps.rust_cache_policy.outputs.registry-key }}
          restore-keys: ${{ steps.rust_cache_policy.outputs.registry-prefix }}
          fail-on-cache-miss: false

      - name: Restore Rust target cache
        id: restore_target
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.target-directory }}
          key: ${{ steps.rust_cache_policy.outputs.target-key }}
          restore-keys: ${{ steps.rust_cache_policy.outputs.target-prefix }}
          fail-on-cache-miss: false

      - name: Clear restored Cargo timing diagnostics
        if: steps.rust_cache_policy.outcome == 'success'
        run: node scripts/ci-cache.mjs clear-timings

      - name: Record restored Rust cache metrics
        if: always() && steps.rust_cache_policy.outcome == 'success'
        continue-on-error: true
        env:
          AKRA_CI_CACHE_REGISTRY_PRIMARY: ${{ steps.restore_registry.outputs.cache-primary-key }}
          AKRA_CI_CACHE_REGISTRY_MATCHED: ${{ steps.restore_registry.outputs.cache-matched-key }}
          AKRA_CI_CACHE_REGISTRY_HIT: ${{ steps.restore_registry.outputs.cache-hit }}
          AKRA_CI_CACHE_REGISTRY_OUTCOME: ${{ steps.restore_registry.outcome }}
          AKRA_CI_CACHE_TARGET_PRIMARY: ${{ steps.restore_target.outputs.cache-primary-key }}
          AKRA_CI_CACHE_TARGET_MATCHED: ${{ steps.restore_target.outputs.cache-matched-key }}
          AKRA_CI_CACHE_TARGET_HIT: ${{ steps.restore_target.outputs.cache-hit }}
          AKRA_CI_CACHE_TARGET_OUTCOME: ${{ steps.restore_target.outcome }}
        run: node scripts/ci-cache.mjs record restored

      - name: Run Rust tests
        run: node scripts/ci-performance.mjs run rust-tests -- cargo test --locked --timings

      - name: Test the built native confirmation process
        run: node scripts/ci-performance.mjs run native-confirmation -- node scripts/check_native_confirmation_process.mjs --timings

      - name: Save Rust registry cache
        id: save_registry
        if: success() && steps.rust_cache_policy.outputs.save-allowed == 'true' && steps.restore_registry.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.registry-paths }}
          key: ${{ steps.rust_cache_policy.outputs.registry-key }}

      - name: Save Rust target cache
        id: save_target
        if: success() && steps.rust_cache_policy.outputs.save-allowed == 'true' && steps.restore_target.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.target-directory }}
          key: ${{ steps.rust_cache_policy.outputs.target-key }}

      - name: Record complete Rust cache metrics
        if: always() && steps.rust_cache_policy.outcome == 'success'
        continue-on-error: true
        env:
          AKRA_CI_CACHE_REGISTRY_PRIMARY: ${{ steps.restore_registry.outputs.cache-primary-key }}
          AKRA_CI_CACHE_REGISTRY_MATCHED: ${{ steps.restore_registry.outputs.cache-matched-key }}
          AKRA_CI_CACHE_REGISTRY_HIT: ${{ steps.restore_registry.outputs.cache-hit }}
          AKRA_CI_CACHE_REGISTRY_OUTCOME: ${{ steps.restore_registry.outcome }}
          AKRA_CI_CACHE_REGISTRY_SAVE: ${{ steps.save_registry.outcome }}
          AKRA_CI_CACHE_TARGET_PRIMARY: ${{ steps.restore_target.outputs.cache-primary-key }}
          AKRA_CI_CACHE_TARGET_MATCHED: ${{ steps.restore_target.outputs.cache-matched-key }}
          AKRA_CI_CACHE_TARGET_HIT: ${{ steps.restore_target.outputs.cache-hit }}
          AKRA_CI_CACHE_TARGET_OUTCOME: ${{ steps.restore_target.outcome }}
          AKRA_CI_CACHE_TARGET_SAVE: ${{ steps.save_target.outcome }}
        run: node scripts/ci-cache.mjs record complete

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  rust_lint:
    name: Rust Lint and Architecture
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install measurement runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          components: clippy,rustfmt

      - name: Prepare Rust cache policy
        id: rust_cache_policy
        env:
          AKRA_CI_CACHE_LANE: rust-lint
          AKRA_CI_TARGET: host
          AKRA_CI_FEATURES: all
          AKRA_CI_CACHE_MANIFEST_HASH: ${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config*') }}
          AKRA_CI_CACHE_LOCK_HASH: ${{ hashFiles('**/Cargo.lock') }}
        run: node scripts/ci-cache.mjs plan

      - name: Restore Rust registry cache
        id: restore_registry
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.registry-paths }}
          key: ${{ steps.rust_cache_policy.outputs.registry-key }}
          restore-keys: ${{ steps.rust_cache_policy.outputs.registry-prefix }}
          fail-on-cache-miss: false

      - name: Restore Rust target cache
        id: restore_target
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.target-directory }}
          key: ${{ steps.rust_cache_policy.outputs.target-key }}
          restore-keys: ${{ steps.rust_cache_policy.outputs.target-prefix }}
          fail-on-cache-miss: false

      - name: Clear restored Cargo timing diagnostics
        if: steps.rust_cache_policy.outcome == 'success'
        run: node scripts/ci-cache.mjs clear-timings

      - name: Record restored Rust cache metrics
        if: always() && steps.rust_cache_policy.outcome == 'success'
        continue-on-error: true
        env:
          AKRA_CI_CACHE_REGISTRY_PRIMARY: ${{ steps.restore_registry.outputs.cache-primary-key }}
          AKRA_CI_CACHE_REGISTRY_MATCHED: ${{ steps.restore_registry.outputs.cache-matched-key }}
          AKRA_CI_CACHE_REGISTRY_HIT: ${{ steps.restore_registry.outputs.cache-hit }}
          AKRA_CI_CACHE_REGISTRY_OUTCOME: ${{ steps.restore_registry.outcome }}
          AKRA_CI_CACHE_TARGET_PRIMARY: ${{ steps.restore_target.outputs.cache-primary-key }}
          AKRA_CI_CACHE_TARGET_MATCHED: ${{ steps.restore_target.outputs.cache-matched-key }}
          AKRA_CI_CACHE_TARGET_HIT: ${{ steps.restore_target.outputs.cache-hit }}
          AKRA_CI_CACHE_TARGET_OUTCOME: ${{ steps.restore_target.outcome }}
        run: node scripts/ci-cache.mjs record restored

      - name: Ensure shell tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Check TUI architecture
        run: node scripts/ci-performance.mjs run architecture -- bash scripts/check_tui_layering.sh

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: node scripts/ci-performance.mjs run clippy -- cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Save Rust registry cache
        id: save_registry
        if: success() && steps.rust_cache_policy.outputs.save-allowed == 'true' && steps.restore_registry.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.registry-paths }}
          key: ${{ steps.rust_cache_policy.outputs.registry-key }}

      - name: Save Rust target cache
        id: save_target
        if: success() && steps.rust_cache_policy.outputs.save-allowed == 'true' && steps.restore_target.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.target-directory }}
          key: ${{ steps.rust_cache_policy.outputs.target-key }}

      - name: Record complete Rust cache metrics
        if: always() && steps.rust_cache_policy.outcome == 'success'
        continue-on-error: true
        env:
          AKRA_CI_CACHE_REGISTRY_PRIMARY: ${{ steps.restore_registry.outputs.cache-primary-key }}
          AKRA_CI_CACHE_REGISTRY_MATCHED: ${{ steps.restore_registry.outputs.cache-matched-key }}
          AKRA_CI_CACHE_REGISTRY_HIT: ${{ steps.restore_registry.outputs.cache-hit }}
          AKRA_CI_CACHE_REGISTRY_OUTCOME: ${{ steps.restore_registry.outcome }}
          AKRA_CI_CACHE_REGISTRY_SAVE: ${{ steps.save_registry.outcome }}
          AKRA_CI_CACHE_TARGET_PRIMARY: ${{ steps.restore_target.outputs.cache-primary-key }}
          AKRA_CI_CACHE_TARGET_MATCHED: ${{ steps.restore_target.outputs.cache-matched-key }}
          AKRA_CI_CACHE_TARGET_HIT: ${{ steps.restore_target.outputs.cache-hit }}
          AKRA_CI_CACHE_TARGET_OUTCOME: ${{ steps.restore_target.outcome }}
          AKRA_CI_CACHE_TARGET_SAVE: ${{ steps.save_target.outcome }}
        run: node scripts/ci-cache.mjs record complete

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  node_surfaces:
    name: Node and Admin Surfaces
    needs: scope
    if: needs.scope.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            assets/admin/game/package-lock.json
            desktop/package-lock.json

      - name: Check desktop E2E runner contracts
        run: node --test desktop/scripts/run-e2e.test.mjs

      - name: Run Node and admin checks
        run: node scripts/ci-performance.mjs run node-admin -- bash scripts/check_node_surfaces.sh

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Preserve CI measurements and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-performance-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/ci-performance
            target/cargo-timings
            target/*/cargo-timings
          if-no-files-found: warn
          retention-days: 14

  desktop_e2e:
    name: Desktop Screen Tests (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies and runtime
        run: |
          npm --prefix desktop ci
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring dbus-x11

      - name: Run desktop screen tests
        env:
          CI: "true"
          XDG_CURRENT_DESKTOP: GNOME
          AKRA_E2E_SHARD: ${{ matrix.shard }}/2
        run: |
          node scripts/ci-performance.mjs run desktop-e2e-${{ matrix.shard }} -- dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "akra-ci-fixture-keyring" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run --auto-servernum npm --prefix desktop run e2e
          '

      - name: Summarize CI measurements
        if: always()
        run: node scripts/ci-performance.mjs report

      - name: Upload desktop screen test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            desktop/test-results/e2e/
            artifacts/ci-performance/
          if-no-files-found: warn
          retention-days: 14

  portable_native:
    name: Portable Rust Check (${{ matrix.label }})
    needs: scope
    if: needs.scope.outputs.portable == 'true'
    runs-on: ${{ matrix.runner }}
    # Real Git delivery contracts on native runners can exceed the former 30-minute budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Keep the preinstalled Windows Node used by the native trust checks.
      # setup-node's toolcache directory grants write access to other principals.
      - name: Install measurement runtime
        if: runner.os != 'Windows'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Prepare Rust cache policy
        id: rust_cache_policy
        env:
          AKRA_CI_CACHE_LANE: portable
          AKRA_CI_TARGET: ${{ matrix.target }}
          AKRA_CI_FEATURES: all
          AKRA_CI_CACHE_MANIFEST_HASH: ${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config*') }}
          AKRA_CI_CACHE_LOCK_HASH: ${{ hashFiles('**/Cargo.lock') }}
        run: node scripts/ci-cache.mjs plan

      - name: Restore Rust registry cache
        id: restore_registry
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.registry-paths }}
          key: ${{ steps.rust_cache_policy.outputs.registry-key }}
          restore-keys: ${{ steps.rust_cache_policy.outputs.registry-prefix }}
          fail-on-cache-miss: false

      - name: Restore Rust target cache
        id: restore_target
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.rust_cache_policy.outputs.target-directory }}
          key: ${{ steps.rust_cache_policy.outputs.target-key }}
          restore-keys: ${{ steps.rust_cache_policy.outputs.target-prefix }}
          fail-on-cache-miss: false

      - name: Clear restored Cargo timing diagnostics
        if: steps.rust_cache_policy.outcome == 'success'
        run: node scripts/ci-cache.mjs clear-timings

      - name: Record restored Rust cache metrics
        if: always() && steps.rust_cache_policy.outcome == 'success'
        continue-on-error: true
        env:
          AKRA_CI_CACHE_REGISTRY_PRIMARY: ${{ steps.restore_registry.outputs.cache-primary-key }}
          AKRA_CI_CACHE_REGISTRY_MATCHED: ${{ steps.restore_registry.outputs.cache-matched-key }}
          AKRA_CI_CACHE_REGISTRY_HIT: ${{ steps.restore_registry.outputs.cache-hit }}
          AKRA_CI_CACHE_REGISTRY_OUTCOME: ${{ steps.restore_registry.outcome }}
          AKRA_CI_CACHE_TARGET_PRIMARY: ${{ steps.restore_target.outputs.cache-primary-key }}
          AKRA_CI_CACHE_TARGET_MATCHED: ${{ steps.restore_target.outputs.cache-matched-key }}
          AKRA_CI_CACHE_TARGET_HIT: ${{ steps.restore_target.outputs.cache-hit }}
          AKRA_CI_CACHE_TARGET_OUTCOME: ${{ steps.restore_target.outcome }}
        run: node scripts/ci-cache.mjs record restored

      - name: Run Windows portable validation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: node scripts/ci-performance.mjs run windows-portable -- bash scripts/check_windows_portable.sh

      - name: Check native target
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: node scripts/ci-performance.mjs run native-check -- cargo check --locked --all-features --lib --bins --timings --target "${{ matrix.target }}"

      - name: Prepare and run native contract tests
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        env:
          AKRA_CI_TARGET: ${{ matrix.target }}
          AKRA_CI_FEATURES: all
        run: |
          node scripts/ci-performance.mjs run native-contracts -- \
            node scripts/run_native_rust_contracts.mjs --all-features \
            --target "${{ matrix.target }}" --timings -- \
            'process_liveness::tests::' \
            'trusted_executable::tests::native_' \
            'private_sqlite::tests::' \
            'sqlite_issue_automation_restart_registry::tests::' \
            'application::service::issue_coordinator::tests::autonomy::' \
            'composition::issue_collection::restart_registry_tests::' \
            'composition::repository_kernel::restart_tests::' \
            'adapter::inbound::gateway::restart::tests::' \
            'provider_credentials' \
            'provider_work' \
            'provider_http' \
            'adapter::outbound::jira::issue_source::tests::' \
            'adapter::outbound::jira::issue_feedback::tests::' \
            'domain::issue_automation::source::tests::jira::' \
            'domain::issue_automation::triage::tests::jira::' \
            'application::service::issue_automation_policy::tests::jira' \
            'application::service::issue_collection::tests::jira::' \
            'sqlite_issue_source_claims::tests::' \
            'application::service::issue_coordinator::tests::jira::' \
            'application::service::issue_feedback::tests::jira::' \
            'sqlite_issue_automation_store::feedback::tests::jira::' \
            'adapter::inbound::kernel_protocol::issue_automation::triage::tests::' \
            'application::port::outbound::planning_work_order_repository_port::tests::jira_' \
            'application::service::parallel_mode::tests::pool::lease::malformed_jira_branch_keys_' \
            'application::service::parallel_mode::distributor::delivery::github::tests::jira_pr_metadata_' \
            'application::service::parallel_mode::tests::pool::lease::jira_branch_' \
            'application::service::parallel_mode::tests::distributor::work_permits::link_reference::jira_work_link_' \
            'adapter::outbound::linear::' \
            'application::service::issue_collection::tests::linear::' \
            'application::service::issue_automation_policy::tests::linear::' \
            'provider_key_store' \
            'native_credential_prompt' \
            'provider_credential_prompt' \
            'provider_credential_migration' \
            'private_ipc::credential' \
            'private_ipc::owner' \
