name: Linux Validator Native Evidence

on:
  pull_request:
    branches: [main, prerelease, 'codex/**']
    paths:
      - 'src/adapter/outbound/issue_code_validator/**'
      - 'src/adapter/outbound/issue_code_validator.rs'
      - 'src/application/service/issue_code_validator.rs'
      - '.github/workflows/linux-validator-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-validator-native-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Linux validator boundaries
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
      - name: Install pinned upstream runtime on this disposable CI machine
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y meson ninja-build libcap-dev libselinux1-dev pkg-config gcc python3
          build_root="$(mktemp -d "$RUNNER_TEMP/akra-bwrap.XXXXXX")"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$build_root/bubblewrap.tar.xz" \
            https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz
          printf '0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d  %s\n' "$build_root/bubblewrap.tar.xz" | sha256sum --check -
          tar --extract --file "$build_root/bubblewrap.tar.xz" --directory "$build_root" --no-same-owner
          meson setup "$build_root/build" "$build_root/bubblewrap-0.13.1" --prefix=/usr -Dman=disabled -Dtests=false
          meson compile -C "$build_root/build"
          sudo install -o root -g root -m 0755 "$build_root/build/bwrap" /usr/bin/bwrap
      - name: Record native prerequisites without changing host security policy
        run: |
          git rev-parse HEAD
          id -u
          uname -sr
          /usr/bin/bwrap --version
          test "$(id -u)" -ne 0
          test ! -u /usr/bin/bwrap
          stat -c '%U %a %n' /usr/bin/bwrap
          # No sysctl changes, AppArmor unloading, namespace try flags, or fallback.
      - name: Diagnose the exact required namespace boundary with a fixed no-op
        shell: bash
        run: |
          for setting in /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do
            if test -r "$setting"; then
              printf '%s=' "$setting"
              cat "$setting"
            fi
          done
          args=(--unshare-user --disable-userns --assert-userns-disabled
                --unshare-pid --unshare-net --unshare-ipc --unshare-uts --unshare-cgroup
                --cap-drop ALL --die-with-parent --new-session --clearenv
                --setenv PATH /usr/bin:/bin --setenv TMPDIR /tmp)
          for directory in /usr/bin /usr/lib /usr/lib64 /bin /lib /lib64; do
            if test -e "$directory"; then
              stat -Lc '%U %a %n' "$directory"
              args+=(--ro-bind "$directory" "$directory")
            fi
          done
          args+=(--dev /dev --remount-ro /dev --size 16777216 --tmpfs /tmp
                 --remount-ro / --chdir /tmp -- /bin/true)
          /usr/bin/setpriv --no-new-privs /usr/bin/env -i /usr/bin/bwrap "${args[@]}"
      - name: Run real isolation and publication gate evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            changed="$(GIT_MASTER=1 git diff --name-only HEAD^1 HEAD)"
            lifecycle_only=true
            cancellation_test_changed=false
            while IFS= read -r path; do
              case "$path" in
                src/adapter/outbound/issue_code_validator/linux/native_tests.rs)
                  cancellation_test_changed=true ;;
                .github/workflows/linux-validator-native.yml|docs/validation/issue-validator-linux-native.md|\
                src/adapter/outbound/issue_code_validator/linux/native_tests/descendants.rs) ;;
                *) lifecycle_only=false ;;
              esac
            done <<< "$changed"
            if [[ "$lifecycle_only" == true && "$cancellation_test_changed" == true ]]; then
              cargo test --locked --lib \
                adapter::outbound::issue_code_validator::linux::native_tests::native_profile_cancel_stops_live_fixture_and_removes_staging \
                -- --ignored --exact --nocapture
              exit
            fi
          fi
          cargo test --locked --lib 'adapter::outbound::issue_code_validator::linux::' -- --ignored --test-threads=1 --nocapture
