<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="same-origin">
    <title>Admin Login | Akra</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #171b21;
        background: #eef2f6;
        font-family: "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 24px;
        border: 1px solid #d7dde5;
        border-radius: 8px;
        background: #ffffff;
      }
      h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0; }
      p { margin: 0 0 20px; color: #4f5b6b; line-height: 1.5; }
      label { display: grid; gap: 8px; font-weight: 700; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #b8c2cf;
        border-radius: 6px;
        font: inherit;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 10px 14px;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        background: #0f62fe;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .error {
        margin: 0 0 16px;
        padding: 10px 12px;
        border: 1px solid #e6a8a3;
        border-radius: 6px;
        color: #8f1d16;
        background: #fff1f0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Akra Admin</h1>
      <p>Enter the capability token printed by the local admin process.</p>
      {% if let Some(error_message) = error_message %}
      <p class="error" role="alert">{{ error_message }}</p>
      {% endif %}
      <form method="post" action="/admin/login">
        <label>
          Capability token
          <input type="password" name="token" autocomplete="off" required autofocus>
        </label>
        <button type="submit">Authenticate</button>
      </form>
    </main>
  </body>
</html>
