<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc" xml:space="preserve">
  <title id="title">Akra Grok-style fullscreen TUI validation capture</title>
  <desc id="desc">A 100 by 30 Ratatui TestBackend frame showing one ordered transcript, a collapsed explore card, an expanded semantic patch, and a fixed composer.</desc>
  <defs>
    <radialGradient id="bg" cx="18%" cy="0%" r="90%">
      <stop offset="0" stop-color="#21333d"/>
      <stop offset="0.55" stop-color="#11151c"/>
      <stop offset="1" stop-color="#0c1016"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <style>
      .ui { font-family: Inter, Segoe UI, sans-serif; fill: #e8edf5; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 18px; fill: #e8edf5; }
      .muted { fill: #909bad; }
      .role { fill: #42e8d0; font-weight: 700; }
      .tool { fill: #c384ff; font-weight: 700; }
      .amber { fill: #efc66b; }
      .green { fill: #72e39a; }
      .red { fill: #ff7b8a; }
    </style>
  </defs>
  <rect width="1440" height="980" fill="url(#bg)"/>
  <text x="82" y="66" class="ui" font-size="30" font-weight="700">Akra · app-owned fullscreen transcript</text>
  <text x="82" y="96" class="ui muted" font-size="16">100×30 frame emitted by the production renderer through Ratatui TestBackend</text>
  <g transform="translate(1040 53)">
    <rect width="300" height="42" rx="21" fill="#16231d" stroke="#2d7650"/>
    <circle cx="22" cy="21" r="5" fill="#72e39a"/>
    <text x="38" y="27" class="ui green" font-size="14" font-weight="650">actual renderer · passing proof</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="130" width="1300" height="770" rx="16" fill="#242a33" stroke="#485466"/>
    <path d="M70 176H1370" stroke="#3a4657"/>
    <circle cx="96" cy="153" r="6" fill="#ff6f7d"/>
    <circle cx="116" cy="153" r="6" fill="#e7bd55"/>
    <circle cx="136" cy="153" r="6" fill="#61d18b"/>
    <text x="160" y="159" class="ui muted" font-size="13" font-weight="650">AKRA · FULLSCREEN 100×30</text>
  </g>

  <g class="mono">
    <text x="100" y="215" class="role">You:</text>
    <text x="100" y="243">  Refactor the transcript into one app-owned fullscreen viewport.</text>

    <text x="100" y="291" class="role">Codex Commentary:</text>
    <text x="100" y="319">  I’ll inspect the stream reducer and terminal transaction.</text>

    <text x="100" y="367"><tspan class="tool">› ◆ explore</tspan><tspan>   Explored 3 targets</tspan></text>

    <text x="100" y="415" class="role">Codex Commentary:</text>
    <text x="100" y="443">  The canonical row can now be updated in place without transcript replay.</text>

    <text x="100" y="491"><tspan class="tool">▼ ◆ patch</tspan><tspan>     file change: update transcript viewport  </tspan><tspan class="muted">7 lines</tspan></text>
    <text x="100" y="519">    [update] src/adapter/inbound/tui/app/transcript_viewport_ui.rs</text>
    <text x="100" y="547">• Edited transcript_viewport_ui.rs</text>
    <rect x="92" y="562" width="316" height="28" rx="3" fill="#5c2530" opacity="0.42"/>
    <text x="100" y="583" class="red">42 -host_scrollback</text>
    <rect x="92" y="594" width="316" height="28" rx="3" fill="#204d33" opacity="0.5"/>
    <text x="100" y="615" class="green">42 +app_owned_viewport</text>

    <path d="M92 722H1348" stroke="#394452"/>
    <text x="100" y="754">Akra / root  ·  PENDING  ·  queue off  ·  agents off  ·  terminals 0  ·  gpt-5.5/high</text>
    <text x="100" y="782" class="amber">startup: startup checks still running</text>
    <text x="100" y="810" class="muted">… CHECKING  ·  input pending  ·  Ctrl+D details</text>
    <text x="100" y="842" class="role">╭ Task</text>
    <text x="100" y="870"><tspan class="role">│ &gt; </tspan><tspan class="muted">Describe a task or type : for commands</tspan></text>
    <text x="100" y="898"><tspan class="role">╰</tspan><tspan>  Type now  |  submission waits for startup</tspan></text>
  </g>

  <text x="72" y="946" class="ui muted" font-size="13">Proof: shell_rendering::tests::reference_capture_is_rendered_by_the_real_fullscreen_testbackend · 2026-08-01</text>
</svg>
