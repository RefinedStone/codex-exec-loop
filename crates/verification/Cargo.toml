[package]
name = "akra-verification"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"
description = "Independent task evidence, host verification facts, and capture ports"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
