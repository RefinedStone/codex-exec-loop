[package]
name = "codex-exec-loop-native"
version = "1.3.5"
edition = "2024"
default-run = "codex-exec-loop-native"

[features]
tokio-console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
anyhow = "1.0"
askama = "0.12"
base64 = "0.22"
axum = { version = "0.8", features = ["form", "json", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
errno = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
libc = "0.2"
console-subscriber = { version = "0.5", default-features = false, features = ["env-filter"], optional = true }
# The raw descriptor backend returns from Unix PTY EOF/HUP so the outer shutdown loop can
# observe SIGHUP.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
rand = "0.8"
# Evidence Vault 레코드의 인증 암호화(AEAD)에 쓴다 (#2421). rustls 가 이미 쓰는 구현이다.
ring = "0.17"
# Evidence Vault 키를 OS 키 저장소(macOS Keychain, Windows Credential Manager, Linux Secret Service)에 둔다 (#2422).
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
ratatui = { version = "0.30", features = ["scrolling-regions", "crossterm_0_29", "unstable-backend-writer", "unstable-rendered-line-info"] }
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
signal-hook = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
# dots 클라우드 TLS 의 암호화 provider 를 고정한다(ring). rustls 0.23 은 provider 를 자동 선택하지 않는다.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# akra-gateway relays WebSocket frames between local IPC clients and `codex app-server proxy` children.
# dots 클라우드 upstream(wss://)에 붙으려면 connect 와 TLS(webpki 루트, 순수 Rust)가 필요하다 (D-19).
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake", "connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-stream = "0.1"
toml = "0.8"
toml_edit = "0.22"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
which = "8.0"
zeroize = "1"
schemars = "1"

jsonschema = { version = "0.61.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }


[dev-dependencies]
insta = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
vt100 = "0.16.2"

# Keep the default edit/test loop incremental without full type/variable debug data.
# The test profile inherits dev; release keeps Cargo's independent defaults.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

# Opt in when inspecting variables or stepping into dependencies.
# A separate output directory preserves the everyday target/debug cache.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
