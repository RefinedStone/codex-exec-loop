[package]
name = "codex-exec-loop-native"
version = "1.3.5"
edition = "2024"
default-run = "codex-exec-loop-native"

[features]
tokio-console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
anyhow = "1.0"
askama = "0.12"
base64 = "0.22"
axum = { version = "0.8", features = ["form", "json", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde"] }
errno = "0.3"
http = "1"
libc = "0.2"
console-subscriber = { version = "0.5", default-features = false, features = ["env-filter"], optional = true }
# The raw descriptor backend returns from Unix PTY EOF/HUP so the outer shutdown loop can
# observe SIGHUP.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
rand = "0.8"
ratatui = { version = "0.30", features = ["scrolling-regions", "crossterm_0_29", "unstable-backend-writer", "unstable-rendered-line-info"] }
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
# dots 클라우드 TLS 의 암호화 provider 를 고정한다(ring). rustls 0.23 은 provider 를 자동 선택하지 않는다.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# akra-gateway relays WebSocket frames between local IPC clients and `codex app-server proxy` children.
# dots 클라우드 upstream(wss://)에 붙으려면 connect 와 TLS(webpki 루트, 순수 Rust)가 필요하다 (D-19).
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake", "connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-stream = "0.1"
toml = "0.8"
toml_edit = "0.22"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
which = "8.0"
schemars = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
insta = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
vt100 = "0.16.2"
